<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AprilTag Pose · Computer Vision with JavaScript</title>
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #101318; }</style>

  <!-- 1) three-phone: classic script, window globals -->
  <script src="https://cdn.jsdelivr.net/npm/three-phone@0.2.0/dist/three-phone.min.js"></script>
  <!-- Comlink talks to the AprilTag Web Worker in vendor/apriltag/ -->
  <script src="https://cdn.jsdelivr.net/npm/comlink@4.4.2/dist/umd/comlink.min.js"></script>
  <script src="../../shared/frame.js"></script>
  <script src="../../shared/status-overlay.js"></script>

  <!-- 2) three.js via import map -->
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- 3) loader: make THREE global, then run the plain scripts that use it -->
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    for (const src of ['../../shared/three-helpers.js', 'sketch.js']) {
      await new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        document.body.appendChild(s);
      });
    }
  </script>
</body>
</html>
