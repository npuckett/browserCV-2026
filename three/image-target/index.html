<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Image Target · Computer Vision with JavaScript</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101318; font-family: system-ui, sans-serif; }
    #container { position: absolute; inset: 0; z-index: 0; } /* its own layer, so the camera picture MindAR puts at z-index -2 shows above the page background */
    #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.8); color: #fff; text-align: center; padding: 24px; }
    #start button { font: 700 17px system-ui, sans-serif; padding: 14px 22px; border: 0; border-radius: 10px; background: #fff; color: #111; }
    #start a { color: #9cd8ff; }
    #status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 14px 16px; color: #f7f7f7;
      background: rgba(10, 13, 18, 0.85); font-size: 15px; }
  </style>

  <!-- three-phone for lockGestures(). MindAR opens the camera itself. -->
  <script src="https://cdn.jsdelivr.net/npm/three-phone@0.2.0/dist/three-phone.min.js"></script>
  <script src="../../shared/status-overlay.js"></script>

  <!-- three.js, three-phone's pinned version, plus MindAR. The "scopes" entry
       sends MindAR's own `import 'three'` to three-compat.js, which adds back
       a constant MindAR still expects. Every other file gets the real three. -->
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js" },
    "scopes": {
      "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/": { "three": "./three-compat.js" } } }
  </script>
</head>
<body>
  <div id="container"></div>
  <div id="start">
    <div>Point the camera at the target image.<br>
      Print it, or open it on another screen:
      <a href="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" target="_blank">card.png</a></div>
    <button id="startButton">Start camera</button>
  </div>
  <div id="status">Waiting to start</div>

  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    const s = document.createElement('script');
    s.src = 'sketch.js';
    document.body.appendChild(s);
  </script>
</body>
</html>
